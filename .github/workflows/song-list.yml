name: Apply song list update
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: song-list
  cancel-in-progress: false
jobs:
  apply:
    if: startsWith(github.event.issue.title, 'Song list update')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: apply
        run: node .github/scripts/apply-songs.js
      - if: steps.apply.outputs.changed == 'true'
        run: |
          git config user.name "jukebox-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add songs.json
          git commit -m "Song list update from issue #${ISSUE}"
          git push
        env:
          ISSUE: ${{ github.event.issue.number }}
      - run: |
          gh issue comment "$ISSUE" --body-file /tmp/result.md
          gh issue close "$ISSUE"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
